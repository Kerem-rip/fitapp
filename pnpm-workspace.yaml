packages:
  - "apps/*"
  - "packages/*"

# Kurulumda kendi betiğini çalıştırmasına izin verilen paketler (güvenlik için varsayılan kapalı)
allowBuilds:
  sharp: false
  unrs-resolver: false
  prisma: true
  "@prisma/engines": true
  "@prisma/client": true

minimumReleaseAgeExclude:
  - expo-secure-store@58.0.3
  - expo-document-picker@58.0.5
  - "@expo/config-plugins@58.0.13"
  - "@expo/plist@0.10.2"
  - "@expo/require-utils@58.0.6"
  - expo-sharing@58.0.23
